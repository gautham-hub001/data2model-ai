name: Deploy Java Backend (Render)

on:
  push:
    branches: [main]
    paths:
      - "backend-java/**"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build & test
        working-directory: backend-java
        run: mvn -B verify

      - name: Trigger Render redeploy
        run: |
          curl -X POST "${{ secrets.RENDER_JAVA_DEPLOY_HOOK }}"
