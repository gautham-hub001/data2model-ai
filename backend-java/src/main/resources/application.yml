server:
  port: 8080

spring:
  ai:
    openai:
      # Groq — OpenAI-compatible, free tier: 14,400 req/day, 30 RPM, no credit card needed
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: llama-3.3-70b-versatile

  security:
    oauth2:
      resourceserver:
        jwt:
          # Clerk JWKS endpoint — replace <your-clerk-frontend-api> with your Clerk domain
          jwk-set-uri: ${CLERK_JWKS_URI}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  python-api-url: ${PYTHON_API_URL:http://localhost:5001}
  internal-token: ${INTERNAL_TOKEN}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  supabase:
    url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
  rate-limit:
    requests-per-hour: ${RATE_LIMIT_RPH:3}
  workflow:
    stream-timeout-seconds: ${STREAM_TIMEOUT_SECONDS:120}
    stomp-ready-delay-ms: ${STOMP_READY_DELAY_MS:1000}

# Tune JVM for Render free tier (512MB RAM)
# Set JAVA_OPTS=-Xmx350m -Xms256m in Render environment

logging:
  level:
    com.data2model: DEBUG
    org.springframework.ai: INFO
